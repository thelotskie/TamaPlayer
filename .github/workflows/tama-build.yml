name: Tama Player Build

# Our cloud build: one installable debug APK, no signing secrets needed.
# AGP signs debug builds automatically, so the artifact installs as-is.
# For a signed release build, add the SIGNING_* secrets and use release.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tama-build.yml'

permissions:
  contents: read

concurrency:
  group: tama-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tama Player (Standard Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # BuildConfig GIT_COUNT / version code need full history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Standard Debug APK
        # arm64-only + a 6g heap: the first full build compiled everything but
        # died in :app:packageStandardDebug with OutOfMemoryError (Zipflinger)
        # while packaging 4 ABI splits on the default heap. His devices are
        # all arm64, so one ABI is the right test build anyway.
        run: ./gradlew :app:assembleStandardDebug -PtargetAbi=arm64-v8a -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TamaPlayer-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 30
